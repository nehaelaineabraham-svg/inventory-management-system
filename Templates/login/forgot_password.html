{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - IIMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(120deg, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wrapper {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 45px 35px;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card h2 {
            text-align: center;
            color: #0f2027;
            margin-bottom: 8px;
        }

        .card p {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            font-size: 14px;
            color: #333;
            display: block;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            transition: 0.3s ease;
        }

        .form-group input:focus {
            border-color: #2c5364;
            outline: none;
            box-shadow: 0 0 8px rgba(44, 83, 100, 0.3);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(120deg, #203a43, #2c5364);
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .back-link {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
        }

        .back-link a {
            color: #2c5364;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .alert-error {
            background: #ffe5e5;
            color: #cc0000;
        }

        .alert-success {
            background: #e6ffed;
            color: #008a2e;
        }

        /* Loading */
        .loading {
            position: fixed;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, #0f2027, #203a43, #2c5364);
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            visibility: hidden;
            opacity: 0;
            transition: 0.4s ease;
        }

        .loading.active {
            visibility: visible;
            opacity: 1;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #ffffff;
            border-top: 5px solid #203a43;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: white;
            font-size: 15px;
        }

    </style>
</head>
<body>

<div class="wrapper">
    <div class="card">
        <h2>Forgot Password?</h2>
        <p>Enter your registered email to reset your password</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'forgot_password' %}" id="forgotForm">
            {% csrf_token %}

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required>
            </div>

            <button type="submit" class="btn">
                Send Reset Link
            </button>
        </form>

        <div class="back-link">
            <a href="{% url 'login' %}">← Back to Login</a>
        </div>
    </div>
</div>

<!-- Loading Screen -->
<div class="loading" id="loadingScreen">
    <div class="spinner"></div>
    <div class="loading-text">Sending reset link...</div>
</div>

<script>
    const form = document.getElementById("forgotForm");
    const loading = document.getElementById("loadingScreen");

    form.addEventListener("submit", function () {
        loading.classList.add("active");
    });
</script>

</body>
</html>
