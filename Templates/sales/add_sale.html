{% extends 'admin/admin_layout.html' %}
{% load static %}
{% block content %}

<head>
    <link rel="stylesheet" href="{% static 'admin/assets/css/commonstyleadmin.css' %}">
</head>

<main>
    <div class="container-fluid px-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="mt-2 mb-0" style="font-size: 1.5rem;">New Sales Order</h1>
        </div>
        <div class="row">
            <div class="col-12">
                <div class="card mb-4">
                    <div class="card-body">
                        <form action="{% url 'save_sale' %}" method="post" id="saleForm">
                            {% csrf_token %}
                            <div class="row">
                                <div class="col-md-4">
                                    <label class="form-label">Sale Number</label>
                                    <input type="text" class="form-control" value="{{ sale_number }}" readonly>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Sale Date</label>
                                    <input type="date" class="form-control" name="sale_date" required id="sale_date"
                                        readonly>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Customer</label>
                                    <select class="form-control" name="customer_id" required>
                                        <option value="">-- Select Customer --</option>
                                        <option value="0">Cash Customer</option>
                                        {% for c in customers %}
                                        <option value="{{c.id}}">{{c.customer_name}}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-12 mt-2">
                                    <div class="table-responsive">
                                        <table class="table table-bordered" id="itemsTable">
                                            <thead>
                                                <tr>
                                                    <th class="align-middle">Product</th>
                                                    <th class="align-middle">Unit</th>
                                                    <th class="align-middle" style="width:100px;">Quantity</th>
                                                    <th class="align-middle text-right" style="width:120px;">Rate</th>
                                                    <th class="align-middle text-right" style="width:150px;">Total</th>
                                                    <th class="align-middle">
                                                        <button type="button" class="btn btn-primary btn-sm"
                                                            id="addRow"><span class="fw-bold">New Row</span></button>
                                                    </th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr class="item-row">
                                                    <td>
                                                        <select class="form-control product-select" name="product_id[]"
                                                            required>
                                                            <option value="">-- Select Product --</option>
                                                            {% for p in products %}
                                                            <option value="{{p.id}}" data-price="{{p.price}}"
                                                                data-unit="{{p.unit_id}}" data-stock="{{p.stock_qty}}"
                                                                {% if p.stock_qty <= 0 %}disabled{% endif %}>
                                                                {{p.product_name}} (Stock: {{p.stock_qty}})
                                                            </option>
                                                            {% endfor %}
                                                        </select>
                                                    </td>
                                                    <td>
                                                        <select class="form-control unit-select" name="unit[]" required
                                                            disabled>
                                                            <option value="">-- Select Unit --</option>
                                                            {% for u in units %}
                                                            <option value="{{u.unit_id}}">{{u.unit_name}}</option>
                                                            {% endfor %}
                                                        </select>
                                                    </td>
                                                    <td>
                                                        <input type="number" class="qty-input form-control" name="qty[]"
                                                            min="1" required>
                                                    </td>
                                                    <td>
                                                        <input type="number" step="0.01"
                                                            class="price-input form-control" name="price[]" readonly>
                                                    </td>
                                                    <td>
                                                        <input type="number" step="0.01"
                                                            class="total-input form-control" name="total[]" readonly>
                                                    </td>
                                                    <td>
                                                        <button type="button" class="btn btn-danger btn-sm remove-row">
                                                            <span class="fas fa-trash fa-xl"></span></button>
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>

                            <br />


                            <div class="form-row">
                                <div class="form-col-12 d-flex align-items-end justify-content-end">
                                    <div class="button-group">
                                        <button type="submit" class="professional-btn text-white"
                                            style="background-color:darkgreen !important;">
                                            <span class="fas fa-save"></span>&nbsp;Save Sale
                                        </button>
                                        <a href="{% url 'sales_list' %}"
                                            class="professional-btn professional-btn-cancel"
                                            style="background-color:red !important;">
                                            <i class="fas fa-cancel"></i>&nbsp;Cancel
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function () {
        // Set today's date as default
        var today = new Date().toISOString().split('T')[0];
        $('#sale_date').val(today);

        // Add Row
        $('#addRow').click(function () {
            var newRow = $('.item-row:first').clone();
            newRow.find('input').val('');
            newRow.find('select').val('');
            $('#itemsTable tbody').append(newRow);
        });

        // Remove Row
        $(document).on('click', '.remove-row', function () {
            if ($('.item-row').length > 1) {
                $(this).closest('tr').remove();
            } else {
                alert("At least one item is required.");
            }
        });

        // Update price and unit based on product selection
        $(document).on('change', '.product-select', function () {
            var selectedOption = $(this).find(':selected');
            var price = selectedOption.data('price');
            var unitId = selectedOption.data('unit');
            var row = $(this).closest('tr');

            row.find('.qty-input').val(0);

            if (unitId) {
                row.find('.unit-select').val(unitId);
            }
            if (price) {
                row.find('.price-input').val(price);
            }

            calculateRowTotal(row);
        });

        // Calculate total on qty or price change
        $(document).on('input', '.qty-input, .price-input', function () {
            var row = $(this).closest('tr');
            var qty = parseFloat(row.find('.qty-input').val()) || 0;
            var stock = parseFloat(row.find('.product-select option:selected').data('stock')) || 0;

            if (qty > stock) {
                alert("Quantity cannot exceed available stock (" + stock + ")");
                row.find('.qty-input').val(stock);
                calculateRowTotal(row);
                return;
            }

            calculateRowTotal(row);
        });

        function calculateRowTotal(row) {
            var qty = row.find('.qty-input').val() || 0;
            var price = row.find('.price-input').val() || 0;
            var total = (parseFloat(qty) * parseFloat(price)).toFixed(2);
            row.find('.total-input').val(total);
        }
    });
</script>

{% endblock %}
