{% extends 'manager/manager_layout.html' %}
{% load static %}
{% block content %}

<head>
    <link rel="stylesheet" href="{% static 'admin/assets/css/commonstyleadmin.css' %}">
</head>
<main>
    <div class="container-fluid px-4">
        <div class="row">
            <div class="col-xl-12">
                <div class="card mb-4">
                    <div class="card-header">
                        <i class="fas fa-key"></i>
                        Change Password
                    </div>
                    <div class="card-body">
                        <form method="post" action="{% url 'manager_update_password' %}">
                            {% csrf_token %}
                            <div class="form-row">
                                <div class="form-col-6 form-group mb-3">
                                    <label class="form-label">Current Password <span
                                            class="required-indicator">*</span></label>
                                    <input type="password" class="form-control w-100" name="old_pass" required>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-col-6 form-group mb-3">
                                    <label class="form-label">New Password <span
                                            class="required-indicator">*</span></label>
                                    <input type="password" class="form-control w-100" name="new_pass" required>
                                </div>
                                <div class="form-col-6 form-group mb-3">
                                    <label class="form-label">Confirm Password <span
                                            class="required-indicator">*</span></label>
                                    <input type="password" class="form-control w-100" name="confirm_pass" required>
                                </div>
                            </div>

                            <div class="form-row mt-4">
                                <div class="form-col-12 d-flex justify-content-start">
                                    <div class="button-group">
                                        <button type="submit" class="professional-btn text-white"
                                            style="background-color:darkgreen !important; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: 600;">
                                            <span class="fas fa-save"></span>&nbsp;Update Password
                                        </button>
                                        <a href="{% url 'manager_profile' %}"
                                            class="professional-btn professional-btn-cancel"
                                            style="background-color:red !important; color: white !important; text-decoration: none; padding: 10px 20px; border-radius: 4px; font-weight: 600; margin-left: 10px; display: inline-block;">
                                            <i class="fas fa-times"></i>&nbsp;Cancel
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
