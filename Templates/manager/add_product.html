{% extends 'manager/manager_layout.html' %}
{% load static %}
{% block content %}

<main>
    <div class="container-fluid px-4">
        <h1 class="mt-4">Add New Product</h1>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a href="{% url 'manager_products' %}">Products</a></li>
            <li class="breadcrumb-item active">Add Product</li>
        </ol>

        <div class="row">
            <div class="col-xl-6">
                <div class="card mb-4">
                    <div class="card-header">
                        <i class="fas fa-plus me-1"></i>
                        Product Details
                    </div>
                    <div class="card-body">
                        <form action="{% url 'manager_save_product' %}" method="post">
                            {% csrf_token %}
                            <div class="form-group mb-3">
                                <label>Product Name</label>
                                <input type="text" class="form-control" name="product_name" required
                                    placeholder="e.g. Wireless Mouse">
                            </div>
                            <div class="form-group mb-3">
                                <label>SKU</label>
                                <input type="text" class="form-control" name="sku" required placeholder="e.g. SKU-001">
                            </div>
                            <div class="form-group mb-3">
                                <label>Category</label>
                                <select class="form-control" name="cat_id" required>
                                    <option value="">Select Category</option>
                                    {% for cat in categories %}
                                    <option value="{{cat.id}}">{{cat.cat_name}}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group mb-3">
                                <label>Unit</label>
                                <input type="text" class="form-control" name="unit" placeholder="e.g. PCS, KG, LTR"
                                    required>
                            </div>
                            <div class="form-group mb-3">
                                <label>Proposed Selling Price</label>
                                <input type="number" step="0.01" class="form-control" name="price" required>
                            </div>
                            <div class="form-group mb-3">
                                <label>Reorder Level</label>
                                <input type="number" class="form-control" name="reorder_level" value="10"
                                    title="Stock level at which to trigger a reorder alert">
                            </div>
                            <div class="form-group">
                                <input type="submit" value="Save Product" class="btn btn-success">
                                <a href="{% url 'manager_products' %}" class="btn btn-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

{% endblock %}
