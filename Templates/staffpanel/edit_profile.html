{% extends 'staffpanel/staff_layout.html' %}
{% load static %}
{% block content %}

<main>
    <div class="container-fluid px-4">
        <h1 class="mt-4">Edit Profile</h1>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a href="{% url 'staff_dashboard' %}">Dashboard</a></li>
            <li class="breadcrumb-item"><a href="{% url 'staff_profile' %}">My Profile</a></li>
            <li class="breadcrumb-item active">Edit Profile</li>
        </ol>

        <div class="row">
            <div class="col-xl-6">
                <div class="card mb-4">
                    <div class="card-header">
                        <i class="fas fa-edit me-1"></i>
                        Update Details
                    </div>
                    <div class="card-body">
                        <form method="post" action="">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="name" class="form-label">Name</label>
                                <input type="text" class="form-control" id="name" name="name"
                                    value="{{ user_details.name }}" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email / Username</label>
                                <input type="text" class="form-control" id="email" name="email"
                                    value="{{ user_details.email }}" required>
                                <div class="form-text text-muted">Thinking twice? Changing this will change your login
                                    username.</div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">Update Profile</button>
                                <a href="{% url 'staff_profile' %}" class="btn btn-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

{% endblock %}
